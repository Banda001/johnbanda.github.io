name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy site files to staging directory
        run: |
          mkdir -p _site
          cp index.html styles.css script.js John_Banda_CV.pdf _site/
          cp "Pic 1.jpeg" "Pic 2.jpeg" "Pic 3.jpeg" "Pic 4.jpeg" "Pic 5.jpeg" "Pic 6.jpeg" _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
